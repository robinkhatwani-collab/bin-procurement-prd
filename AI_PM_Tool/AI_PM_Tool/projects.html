<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>All Projects — AI PM Tool</title>
  <style>

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b0f1a; --surface: #111827; --surface2: #161d2e; --surface3: #1c2540;
      --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.13);
      --text: #f0f4ff; --text-muted: #8b9ab4; --text-dim: #5a6a84;
      --primary: #4f8ef7; --primary-dim: rgba(79,142,247,0.15);
      --secondary: #2dd4bf; --secondary-dim: rgba(45,212,191,0.15);
      --purple: #9f6ef5; --purple-dim: rgba(159,110,245,0.15);
      --accent: #f59e0b; --accent-dim: rgba(245,158,11,0.15);
      --green: #34d399; --green-dim: rgba(52,211,153,0.15);
      --red: #f87171; --red-dim: rgba(248,113,113,0.15);
      --radius: 14px; --shadow: 0 4px 24px rgba(0,0,0,0.35);
    }
    html, body { min-height: 100vh; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 15% 15%, rgba(79,142,247,.09) 0%, transparent 60%),
        radial-gradient(ellipse 60% 45% at 85% 75%, rgba(159,110,245,.09) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }
    .page { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
    nav {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 48px; background: rgba(11,15,26,.85);
      backdrop-filter: blur(14px); border-bottom: 1px solid var(--border);
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
    .nav-logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--primary), var(--purple)); border-radius: 8px; display: grid; place-items: center; font-size: 15px; }
    .nav-logo-text { font-size: 15px; font-weight: 700; }
    .nav-logo-text span { color: var(--primary); }
    .back-btn { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text-muted); text-decoration: none; background: rgba(255,255,255,.04); border: 1px solid var(--border); padding: 7px 14px; border-radius: 9px; transition: all .2s; }
    .back-btn:hover { color: var(--text); background: rgba(255,255,255,.07); }
    main { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 48px 32px 80px; width: 100%; }
    .card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 26px; box-shadow: var(--shadow); margin-bottom: 20px; }
    .card h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 10px; }
    .card p { color: var(--text-muted); font-size: 0.93rem; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
    .callout { border-radius: var(--radius); padding: 18px 22px; margin-bottom: 18px; border-left: 4px solid; }
    .callout-blue   { background: rgba(37,99,235,.1);  border-color: var(--primary); }
    .callout-green  { background: rgba(5,150,105,.1);  border-color: var(--green); }
    .callout-amber  { background: rgba(217,119,6,.1);  border-color: var(--accent); }
    .callout-purple { background: rgba(124,58,237,.1); border-color: var(--purple); }
    .callout h4 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; opacity: .6; font-weight: 700; }
    .callout p { font-size: 0.91rem; color: var(--text-muted); }
    .callout strong { color: var(--text); }
    .tag { border-radius: 999px; padding: 3px 12px; font-size: 0.78rem; font-weight: 600; }
    .tag-blue   { background: var(--primary-dim); color: #93c5fd; }
    .tag-green  { background: var(--green-dim);   color: #6ee7b7; }
    .tag-amber  { background: var(--accent-dim);  color: #fcd34d; }
    .tag-purple { background: var(--purple-dim);  color: #c4b5fd; }
    .tag-red    { background: var(--red-dim);      color: #fca5a5; }
    footer { margin-top: auto; text-align: center; padding: 24px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border); }

    .hero { text-align:center; padding:56px 24px 36px; position:relative; z-index:1; }
    .eyebrow { display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--primary);margin-bottom:16px; }
    .eyebrow::before,.eyebrow::after { content:'';display:block;width:22px;height:1px;background:var(--primary);opacity:.5; }
    .hero h1 { font-size:clamp(28px,4vw,46px);font-weight:800;letter-spacing:-1.2px;background:linear-gradient(135deg,#fff 30%,var(--primary) 65%,var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px; }
    .hero p { font-size:15px;color:var(--text-muted);max-width:440px;margin:0 auto 24px; }
    .hero-stats { display:inline-flex;align-items:center;gap:22px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:11px 22px; }
    .hstat .val { font-size:1.4rem;font-weight:800; }
    .hstat .lbl { font-size:.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px; }
    .hdiv { width:1px;height:26px;background:var(--border2); }
    .add-btn { display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,var(--purple),var(--primary));color:#fff;border:none;padding:11px 22px;border-radius:11px;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;box-shadow:0 4px 18px rgba(159,110,245,.3);transition:opacity .2s,transform .2s; }
    .add-btn:hover { opacity:.9;transform:translateY(-1px); }
    main { position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:16px 40px 80px; }
    .toolbar { display:flex;justify-content:space-between;align-items:center;margin-bottom:24px; }
    .toolbar-left { font-size:13px;color:var(--text-muted); }
  </style>
</head>
<body>
<div class="page">
  <nav>
    <a class="nav-logo" href="default.html">
      <div class="nav-logo-icon">🤖</div>
      <div class="nav-logo-text">AI <span>PM</span> Tool</div>
    </a>
    <a class="back-btn" href="default.html">← Dashboard</a>
  </nav>
  <section class="hero">
    <div class="eyebrow">Project Hub</div>
    <h1>All Projects</h1>
    <p>Track every project's PRD, milestones, and DRIs in one place.</p>
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
      <div class="hero-stats">
        <div class="hstat"><div class="val" id="statProjects">—</div><div class="lbl">Projects</div></div>
        <div class="hdiv"></div>
        <div class="hstat"><div class="val" id="statMilestones">—</div><div class="lbl">Milestones</div></div>
        <div class="hdiv"></div>
        <div class="hstat"><div class="val" id="statCompleted">—</div><div class="lbl">Completed</div></div>
      </div>
      <a href="new-project.html" class="add-btn">✨ Add New Project</a>
    </div>
  </section>
  <main>
    <div class="toolbar">
      <div class="toolbar-left" id="toolbarLabel">Loading projects…</div>
    </div>
    <div id="projectGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px;">
    </div><!-- #projectGrid -->
  </main>
  <footer><p>📊 All Projects &nbsp;·&nbsp; Robin AI Learnings &nbsp;·&nbsp; AI PM Tool</p></footer>
</div>

<script>
  const COLORS = ['#4f8ef7','#9f6ef5','#2dd4bf','#f59e0b','#f472b6','#34d399'];

  async function loadProjects() {
    const grid    = document.getElementById('projectGrid');
    const toolbar = document.getElementById('toolbarLabel');

    try {
      const res      = await fetch('projects/registry.json');
      const projects = await res.json();

      if (!projects || projects.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 24px;color:var(--text-muted);">
          <div style="font-size:2.5rem;margin-bottom:16px;">📂</div>
          <div style="font-size:16px;font-weight:600;margin-bottom:8px;">No projects yet</div>
          <div style="font-size:13px;">Upload your first Excel file to get started.</div>
        </div>`;
        document.getElementById('statProjects').textContent  = '0';
        document.getElementById('statMilestones').textContent = '0';
        document.getElementById('statCompleted').textContent  = '0';
        toolbar.textContent = '0 projects';
        return;
      }

      // Compute stats
      const totalMilestones = projects.reduce((s, p) => s + (p.total  || 0), 0);
      const totalDone       = projects.reduce((s, p) => s + (p.done   || 0), 0);

      document.getElementById('statProjects').textContent   = projects.length;
      document.getElementById('statMilestones').textContent = totalMilestones;
      document.getElementById('statCompleted').textContent  = totalDone;
      toolbar.innerHTML = `${projects.length} project${projects.length !== 1 ? 's' : ''} &nbsp;·&nbsp; Last refreshed ${new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}`;

      // Render cards
      grid.innerHTML = projects.map((p, i) => {
        const color    = COLORS[i % COLORS.length];
        const pct      = p.progress || 0;
        const updated  = p.updated ? new Date(p.updated).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '';
        const healthBg = pct >= 70 ? 'rgba(52,211,153,.12)' : pct >= 35 ? 'rgba(245,158,11,.12)' : 'rgba(248,113,113,.12)';
        const healthCl = pct >= 70 ? 'var(--green)'         : pct >= 35 ? 'var(--accent)'        : 'var(--red)';
        const healthBd = pct >= 70 ? 'rgba(52,211,153,.25)' : pct >= 35 ? 'rgba(245,158,11,.25)' : 'rgba(248,113,113,.25)';

        return `
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px;
          position:relative;overflow:hidden;transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease;"
          onmouseover="this.style.transform='translateY(-6px)';this.style.boxShadow='0 16px 40px rgba(0,0,0,.4)'"
          onmouseout="this.style.transform='';this.style.boxShadow=''">
          <div style="position:absolute;top:0;left:0;right:0;height:3px;background:${color};opacity:.8;border-radius:20px 20px 0 0;"></div>
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">
            <div style="width:46px;height:46px;border-radius:12px;background:${color}20;border:1px solid ${color}30;display:grid;place-items:center;font-size:1.3rem;">📊</div>
            <span style="font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:4px 10px;
              border-radius:20px;background:${healthBg};color:${healthCl};border:1px solid ${healthBd};">${pct}% Done</span>
          </div>
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:${color};margin-bottom:8px;">${p.domain || 'Project'}</div>
          <h2 style="font-size:17px;font-weight:700;letter-spacing:-.3px;margin-bottom:10px;line-height:1.3;">${p.title}</h2>
          <p style="font-size:13px;color:var(--text-muted);line-height:1.6;margin-bottom:16px;">${p.objective || ''}</p>
          <div style="height:5px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;margin-bottom:14px;">
            <div style="height:100%;width:${pct}%;background:${color};border-radius:99px;transition:width .6s ease;"></div>
          </div>
          <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;">
            <span style="font-size:11px;font-weight:500;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text-muted);padding:3px 10px;border-radius:8px;">${p.total || 0} milestones</span>
            <span style="font-size:11px;font-weight:500;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text-muted);padding:3px 10px;border-radius:8px;">${p.done || 0} done</span>
            ${p.dris ? `<span style="font-size:11px;font-weight:500;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text-muted);padding:3px 10px;border-radius:8px;">${p.dris} DRIs</span>` : ''}
            ${updated ? `<span style="font-size:11px;font-weight:500;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text-dim);padding:3px 10px;border-radius:8px;">Updated ${updated}</span>` : ''}
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <a href="projects/${p.slug}/prd.html" style="display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;
              background:var(--primary-dim);border:1px solid rgba(79,142,247,.3);border-radius:10px;
              text-decoration:none;color:var(--primary);font-size:12px;font-weight:600;transition:all .2s;"
              onmouseover="this.style.background='rgba(79,142,247,.25)'" onmouseout="this.style.background='var(--primary-dim)'">📄 PRD</a>
            <a href="projects/${p.slug}/status-tracker.html" style="display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;
              background:var(--green-dim);border:1px solid rgba(52,211,153,.3);border-radius:10px;
              text-decoration:none;color:var(--green);font-size:12px;font-weight:600;transition:all .2s;"
              onmouseover="this.style.background='rgba(52,211,153,.25)'" onmouseout="this.style.background='var(--green-dim)'">📊 Tracker</a>
          </div>
        </div>`;
      }).join('');

    } catch (err) {
      grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--red);">
        Could not load projects. Is the server running? (${err.message})
      </div>`;
    }
  }

  loadProjects();
</script>
</body>
</html>
